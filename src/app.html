<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Take attendance at events by scanning the QR code on student ID cards. Works offline; data stays on your device."
		/>
		<meta name="theme-color" content="#f1eee4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			// Apply the saved theme before first paint to avoid a flash.
			try {
				const t = JSON.parse(localStorage.getItem('qrify:settings') || '{}').theme;
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
